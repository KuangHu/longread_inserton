[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multisite-insertion"
version = "0.1.0"
description = "Native repeat discovery with auditable insertion-boundary and flank inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["biopython>=1.86,<2"]

[project.urls]
Repository = "https://github.com/KuangHu/longread_inserton"
Documentation = "https://github.com/KuangHu/longread_inserton#readme"

[project.scripts]
multisite-insertion = "multisite_insertion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["multisite_insertion*"]


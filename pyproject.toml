[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insertion-site-recovery"
version = "0.1.0"
description = "Recover insertion sequences and read-supported empty-site coordinates from MAGs and long reads"
requires-python = ">=3.10"
dependencies = ["pysam>=0.22,<0.25", "edlib>=1.3.9,<2", "pyspoa>=0.2.1,<0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
caller = ["sniffles==2.8.1"]

[project.scripts]
insertion-site-recovery = "site_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

